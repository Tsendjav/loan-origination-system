services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:15.5
    container_name: los-postgres
    environment:
      POSTGRES_DB: los_db
      POSTGRES_USER: los_user
      POSTGRES_PASSWORD: los_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - los-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U los_user -d los_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis ====================
  redis:
    image: redis:7.2-alpine
    container_name: los-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - los-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== MinIO (баримтын сан, сонголтоор) ====================
  # Анхаар: MinIO-гийн community образ 2026-09-д Docker Hub-аас бүх tag-тайгаа
  # устсан, quay.io хувилбар нь anonymous pull-д 401 буцаадаг. Тиймээс энэ
  # сервисийг профайлаар сонголттой болгосон — default `docker compose up`-д
  # эхлэхгүй (backend код одоогоор MinIO-г ашиглахгүй, баримт нь локал
  # `los_uploads` volume-д хадгалагдана).
  #   Асаах: docker compose --profile storage up -d
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    profiles: ["storage"]
    container_name: los-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - los-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== Backend (Spring Boot) ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dockerfile
    image: los-backend:latest
    container_name: los-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/los_db
      DB_USERNAME: los_user
      DB_PASSWORD: los_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8080:8080"
    volumes:
      - los_logs:/app/logs
      - los_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - los-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/los/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # ==================== Frontend (React + Nginx) ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dockerfile
      args:
        VITE_API_URL: /los/api/v1
    image: los-frontend:latest
    container_name: los-frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - los-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  los_logs:
  los_uploads:

networks:
  los-network:
    driver: bridge
