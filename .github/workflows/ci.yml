name: LOS CI

# Push/PR бүрт: backend тест, frontend typecheck+lint+build, compose файл шалгах.
# Docker образ build + stack smoke тест нь .github/workflows/docker-verify.yml дотор.

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend — build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Репо-д mvnw байхгүй тул runner-ийн mvn-ийг ашиглана
      - name: Build and run tests
        working-directory: backend
        run: mvn -B clean verify
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend — typecheck, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Compose config validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

      - name: Validate production override
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
          MINIO_ROOT_PASSWORD: ci-placeholder-password
          REDIS_PASSWORD: ci-placeholder-password
          JWT_SECRET: ci-placeholder-secret-at-least-32-characters-long
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-password
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
