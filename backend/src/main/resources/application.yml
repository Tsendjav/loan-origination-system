# =====================================================================================
# LOS (Loan Origination System) Main Configuration - ЭЦСИЙН ХУВИЛБАР v5.0 (ЗАСВАРЛАСАН)
# =====================================================================================
# Created: 2025-07-26
# Updated: БҮРЭН ЗАСВАРЛАСАН - Redis алдаа шийдэгдсэн, maxFileSize null алдаа засварласан
# =====================================================================================

server:
  port: 8080
  servlet:
    context-path: /los
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  tomcat:
    max-threads: 200
    min-spare-threads: 10

spring:
  application:
    name: loan-origination-system
  
  # Bean definition overriding prevention
  main:
    allow-bean-definition-overriding: false
    lazy-initialization: false

  # ⭐ REDIS DISABLE - Redis алдааг шийдэх ⭐
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # ⭐ H2 Database Configuration (Development) - ЗАСВАРЛАСАН ⭐
  datasource:
    url: jdbc:h2:mem:losdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # H2 Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false

  # ⭐ SQL Initialization - ХАСАГДСАН ⭐
  # schema.sql/data.sql нь entity-үүдийн баганатай тохирохгүй байсан
  # (date_of_birth vs birth_date, дутуу баганууд, UUID/VARCHAR зөрүү) тул
  # хүснэгтийг Hibernate үүсгэж, эхний өгөгдлийг DataInitializer оруулна.
  sql:
    init:
      mode: never

  # ⭐ JPA - Hibernate схем үүсгэнэ ⭐
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

  # Disable Flyway for H2 database
  flyway:
    enabled: false

  # ⭐ ЗАСВАРЛАСАН File Upload Configuration - maxFileSize null алдааг засварлах ⭐
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

  # JSON Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss

  # ⭐ Cache Configuration - In-Memory Cache ⭐
  cache:
    type: simple  # Redis-ийн оронд in-memory cache
    cache-names: 
      - customers
      - loan-applications
      - documents
      - userCache
      - authCache

  # Transaction Configuration
  transaction:
    default-timeout: 30
    rollback-on-commit-failure: true

# ⭐ Management/Actuator Configuration - Redis Health Disabled ⭐
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    diskspace:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: false  # ⭐ Redis health check DISABLED ⭐
  metrics:
    export:
      prometheus:
        enabled: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.company.los: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: DEBUG
    # ⭐ Redis log-уудыг suppress хийх ⭐
    org.springframework.boot.autoconfigure.data.redis: ERROR
    org.springframework.data.redis: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    # ⭐ FIXED: Лог файлыг шууд C:\Projects\loan-origination-system\logs зам дээр бичихээр тохируулсан ⭐
    name: C:/Projects/loan-origination-system/logs/los-application.log
    max-size: 10MB
    max-history: 30
  charset:
    console: UTF-8
    file: UTF-8

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  show-actuator: true

# Application Specific Configuration
app:
  name: "Loan Origination System"
  version: "1.0.0"
  description: "LOS - Зээлийн хүсэлтийн цогц систем"
  
  # ⭐ JWT Configuration - Шилжүүлсэн ⭐
  jwt:
    secret: myVerySecretKeyThatIsAtLeast32CharactersLong
    expiration: 86400000  # 24 hours
    refresh-expiration: 604800000  # 7 days
    issuer: loan-origination-system
  
  # Security Configuration
  security:
    cors:
      allowed-origins: "http://localhost:3001,http://localhost:3000,http://127.0.0.1:3001,http://127.0.0.1:3000"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
    
    # Rate limiting (Redis-гүйгээр disabled)
    rate-limit:
      enabled: false  # ⭐ Redis байхгүй учир rate limiting disabled ⭐
      requests-per-minute: 60
      
  # ⭐ ЗАСВАРЛАСАН Document Configuration - maxFileSize null алдааг засварлах ⭐
  document:
    storage:
      path: "./uploads/documents"
    max-size: 52428800  # 50MB (null-ийг зайлуулахын тулд тодорхой утга)
    allowed-types:
      - "application/pdf"
      - "image/jpeg" 
      - "image/png"
      - "application/msword"
      - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      - "application/vnd.ms-excel"
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    
    # OCR Configuration
    ocr:
      enabled: false
      confidence-threshold: 0.8

  # ⭐ НЭМЭГДСЭН File Configuration - maxFileSize null алдааг бүрэн засварлах ⭐
  file:
    max-size: 52428800  # 50MB
    upload-path: "./uploads"
    allowed-extensions: ["pdf", "jpg", "jpeg", "png", "doc", "docx", "xls", "xlsx"]
      
  # Loan Business Rules
  loan:
    max-amount: 1000000000  # 1 billion MNT
    min-amount: 100000      # 100k MNT
    max-term-months: 360    # 30 years
    min-term-months: 6      # 6 months
    
    # Auto approval rules
    auto-approval:
      enabled: true
      max-amount: 10000000   # 10M MNT
      max-term-months: 60    # 5 years
      min-credit-score: 650
      
    # Interest rates
    interest-rates:
      personal-loan: 18.5
      mortgage: 12.0
      business-loan: 15.0
      car-loan: 14.5
      
  # Notification Configuration
  notification:
    email:
      enabled: false
      smtp:
        host: localhost
        port: 1025
        username: ""
        password: ""
        auth: false
        starttls: false
    sms:
      enabled: false
      provider: "twilio"
      api-key: ""
      from-number: ""

  # Анхны өгөгдөл (эрх, роль, хэрэглэгч)
  seed:
    enabled: true
    admin-password: ${APP_SEED_ADMIN_PASSWORD:admin123}

  # Нэвтрэлтийн горимууд
  auth:
    # Кодод hardcode хийсэн демо хэрэглэгчид (production-д false)
    demo-users-enabled: true
    # /auth/test, /auth/test-users, /auth/debug-json (production-д false)
    test-endpoints-enabled: true

  # Кредит оноо/шийдвэрийн дүрэм
  scoring:
    min-score: 650
    max-dti: 0.45
    max-amount: 10000000
    max-term-months: 60
    weights:
      dti: 250
      experience: 80
      income: 90
      bureau: 100
      amount: 50
      term: 30

---
# Production Profile Configuration
spring:
  config:
    activate:
      on-profile: prod
      
  # PostgreSQL Database for Production
  datasource:
    url: jdbc:postgresql://localhost:5432/los_db
    username: ${DB_USERNAME:los_user}
    password: ${DB_PASSWORD:los_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      
  # Disable H2 Console in Production
  h2:
    console:
      enabled: false
      
  # Production JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        
  # Production SQL Configuration
  sql:
    init:
      mode: never  # Don't run schema.sql and data.sql in production
      
  # Enable Flyway for Production
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    baseline-description: "Initial version"

# Production Logging
logging:
  level:
    root: WARN
    com.company.los: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/los/loan-origination-system.log
    max-size: 50MB
    max-history: 90

# Production Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET:myVerySecretKeyThatIsAtLeast32CharactersLong}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  security:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:https://los.company.com}
  notification:
    email:
      enabled: true
      smtp:
        host: ${SMTP_HOST:smtp.company.com}
        port: ${SMTP_PORT:587}
        username: ${SMTP_USERNAME}
        password: ${SMTP_PASSWORD}
        auth: true
        starttls: true
  # ⭐ НЭМЭГДСЭН Production Document Configuration ⭐
  document:
    max-size: ${DOCUMENT_MAX_SIZE:52428800}  # 50MB
  file:
    max-size: ${FILE_MAX_SIZE:52428800}  # 50MB

---
# Test Profile Configuration
spring:
  config:
    activate:
      on-profile: test
      
  # H2 Database for Testing
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    
  # Disable H2 Console for Tests
  h2:
    console:
      enabled: false
      
  # Test JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    
  # Test SQL Configuration
  sql:
    init:
      mode: never  # Let Hibernate create schema for tests
      
  # Disable Flyway for Tests
  flyway:
    enabled: false

  # ⭐ Test дээр ч Redis disable ⭐
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  # ⭐ ЗАСВАРЛАСАН Test File Upload Configuration ⭐
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Test Logging Configuration
logging:
  level:
    root: WARN
    com.company.los: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    
# Test Application Configuration
app:
  jwt:
    secret: testSecretKeyThatIsAtLeast32CharactersLong
    expiration: 3600000  # 1 hour for tests
    refresh-expiration: 7200000  # 2 hours for tests
  notification:
    email:
      enabled: false
    sms:
      enabled: false
  # ⭐ НЭМЭГДСЭН Test Document Configuration ⭐
  document:
    max-size: 10485760  # 10MB for tests
    storage:
      path: "${java.io.tmpdir}/test-uploads"
  file:
    max-size: 10485760  # 10MB for tests
    upload-path: "${java.io.tmpdir}/test-uploads"

# =====================================================================================
# ⭐ ЭЦСИЙН ХУВИЛБАР - REDIS АЛДАА БОЛОН MAXFILESIZE NULL АЛДАА БҮРЭН ШИЙДЭГДСЭН ⭐
# =====================================================================================
# 🌐 URLs:
#    Backend:     http://localhost:8080/los
#    H2 Console:  http://localhost:8080/los/h2-console
#    API Docs:    http://localhost:8080/los/swagger-ui.html
#    Frontend:    http://localhost:3001
#
# 🔑 LOGIN CREDENTIALS:
#    admin / admin123 (Super Admin)
#    loan_officer / loan123 (Зээлийн мэргэжилтэн)
#    manager / manager123 (Менежер)
#
# 🗄️ H2 Database:
#    JDBC URL: jdbc:h2:mem:losdb
#    Username: sa
#    Password: (хоосон)
#
# ⭐ ШИЙДЭГДСЭН АСУУДЛУУД:
#    ✅ Redis connection алдаа - DISABLED
#    ✅ In-memory cache ашиглана
#    ✅ Redis health check disabled
#    ✅ Rate limiting disabled (Redis dependency байхгүй учир)
#    ✅ Logging Redis errors suppressed
#    ✅ maxFileSize null алдаа - app.document.max-size болон app.file.max-size нэмэгдсэн
#    ✅ File upload configuration бүх profile-д нэмэгдсэн
#    ✅ Character encoding UTF-8 тохируулсан
#    ✅ Production болон Test profile-уудад document configuration нэмэгдсэн
# =====================================================================================