# ================================================================
# Docker орчны тохиргоо (docker compose ашиглах үед)
# Идэвхжүүлэх: SPRING_PROFILES_ACTIVE=docker
# ================================================================
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/los_db}
    username: ${DB_USERNAME:los_user}
    password: ${DB_PASSWORD:los_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Контейнерт schema-г Hibernate-ээр үүсгэнэ (schema.sql ашиглахгүй)
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: never

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

  devtools:
    restart:
      enabled: false

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.company.los: INFO
    org.springframework.web: INFO
  file:
    name: /app/logs/los-application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

app:
  document:
    storage:
      path: /app/uploads/documents
