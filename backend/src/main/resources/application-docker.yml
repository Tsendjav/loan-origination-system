# ================================================================
# Docker орчны тохиргоо (docker compose ашиглах үед)
# Идэвхжүүлэх: SPRING_PROFILES_ACTIVE=docker
# ================================================================
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    # docker compose дотор SPRING_DATASOURCE_URL-аар "postgres" host руу дарж өгнө.
    # Локал (Docker Desktop) дээр ажиллуулахад localhost руу холбогдоно.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/los_db}
    username: ${DB_USERNAME:los_user}
    password: ${DB_PASSWORD:los_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # update: өгөгдөл хадгалагдана (create нь restart бүрт хүснэгтийг шинэчилдэг)
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: never

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

  devtools:
    restart:
      enabled: false

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.company.los: INFO
    org.springframework.web: INFO
  file:
    name: /app/logs/los-application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

app:
  # Seed нь эрх/роль/DB хэрэглэгчийг үүсгэнэ
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:admin123}

  auth:
    # Docker орчинд нэвтрэлт DB хэрэглэгчээр (seed) явагдана
    demo-users-enabled: ${APP_AUTH_DEMO_USERS_ENABLED:false}
    # Тестийн endpoint-ууд хаалттай
    test-endpoints-enabled: false

  scoring:
    min-score: 650
    max-dti: 0.45
    max-amount: 10000000
    max-term-months: 60

  document:
    storage:
      path: /app/uploads/documents
